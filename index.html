<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Loan Tracker</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        .header {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            color: white;
            padding: 40px 20px 60px;
            text-align: center;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .header h1 {
            margin: 0;
            font-size: 1rem;
            font-weight: 500;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance {
            font-size: 2.8rem;
            font-weight: 700;
            margin: 10px 0 0;
            letter-spacing: -1px;
        }

        .container {
            max-width: 500px;
            margin: -30px auto 20px;
            padding: 0 16px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        .input-group {
            margin-bottom: 12px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px; /* Prevents auto-zoom on mobile */
            background-color: #f9fafb;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #fff;
        }

        button {
            width: 100%;
            padding: 16px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
        }

        button:active {
            background-color: var(--primary-dark);
            transform: translateY(1px);
        }

        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .history-item {
            padding: 16px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .history-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .history-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .history-amount {
            font-size: 1.1rem;
            font-weight: 600;
            color: #059669; /* Green for payments */
        }

        .history-date {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .history-note {
            font-size: 0.9rem;
            color: var(--text-muted);
            background: #f3f4f6;
            padding: 6px 10px;
            border-radius: 6px;
            display: inline-block;
            margin-top: 4px;
        }

        .btn-backup {
            background-color: #4b5563;
            margin-top: 10px;
        }
        
        .footer-text {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 20px;
            padding-bottom: 30px;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Remaining Balance</h1>
    <div class="balance" id="balanceDisplay">Loading...</div>
</div>

<div class="container">
    <div class="card">
        <h2 class="card-title">Make a Payment</h2>
        <div class="input-group">
            <input type="number" id="amount" placeholder="Payment Amount (e.g. 5000)" inputmode="decimal">
        </div>
        <div class="input-group">
            <input type="text" id="note" placeholder="Note (Optional, e.g. 'Bonus pay')">
        </div>
        <button onclick="savePayment()">Submit Payment</button>
    </div>

    <div class="card">
        <h2 class="card-title">Payment History</h2>
        <ul class="history-list" id="historyList">
            <!-- History items will load here -->
        </ul>
    </div>

    <button class="btn-backup" onclick="exportData()">💾 Download Backup</button>
    <p class="footer-text">
        Data is securely saved to this device's browser cache.<br>
        Export backups regularly to prevent data loss.
    </p>
</div>

<script>
    // Set your starting total loan amount here
    const TOTAL_LOAN = 4550000; 

    // Load existing data from phone's local storage
    let payments = JSON.parse(localStorage.getItem('myLoanData')) || [];

    // Formats numbers with commas (e.g. 4,550,000)
    function formatMoney(amount) {
        return new Intl.NumberFormat('en-US').format(amount);
    }

    // Formats the date to look nice (e.g. Sep 10, 2026, 2:30 PM)
    function formatDate(dateString) {
        const options = { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
        return new Date(dateString).toLocaleDateString('en-US', options);
    }

    function updateUI() {
        const list = document.getElementById('historyList');
        list.innerHTML = '';
        
        let totalPaid = 0;
        
        // Sort newest payments to the top
        const sortedPayments = [...payments].sort((a, b) => new Date(b.date) - new Date(a.date));

        if (sortedPayments.length === 0) {
            list.innerHTML = '<li style="color: #6b7280; text-align: center; padding: 10px 0;">No payments recorded yet.</li>';
        }

        sortedPayments.forEach(p => {
            totalPaid += p.amount;
            
            let noteHTML = '';
            if (p.note && p.note.trim() !== "") {
                noteHTML = `<div class="history-note">📝 ${p.note}</div>`;
            }

            list.innerHTML += `
                <li class="history-item">
                    <div class="history-main">
                        <span class="history-date">${formatDate(p.date)}</span>
                        <span class="history-amount">- ${formatMoney(p.amount)}</span>
                    </div>
                    ${noteHTML}
                </li>
            `;
        });

        // Calculate and display remaining balance
        const remaining = TOTAL_LOAN - totalPaid;
        document.getElementById('balanceDisplay').innerText = formatMoney(remaining);
    }

    function savePayment() {
        const amount = parseFloat(document.getElementById('amount').value);
        const note = document.getElementById('note').value;
        
        if(isNaN(amount) || amount <= 0) {
            return alert('Please enter a valid payment amount.');
        }

        // Automatically captures the current date and time
        const currentDate = new Date().toISOString();

        // Save the payment
        payments.push({ 
            amount: amount, 
            note: note, 
            date: currentDate 
        });
        
        // Save back to phone's local storage
        localStorage.setItem('myLoanData', JSON.stringify(payments));
        
        // Clear the input fields and refresh the screen
        document.getElementById('amount').value = '';
        document.getElementById('note').value = '';
        updateUI();
    }

    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(payments));
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", "loan_backup.json");
        document.body.appendChild(downloadAnchorNode);
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
    }

    // Run when the app first opens
    updateUI();
</script>
</body>
</html>
